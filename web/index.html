<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Support flow editor</title>
    <script>
      // Apply the saved theme before first paint, on every screen — including
      // pre-auth (Login, workspace picker), which never mounts ui/ThemeToggle.
      // Keep in sync with ui/ThemeToggle.tsx's STORAGE_KEY ("ui-theme").
      try {
        var t = localStorage.getItem("ui-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
