name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt -r requirements-connectors.txt -r requirements-ingest.txt
      # migration numbering + every portable flow still compiles
      - run: python -m scripts.check_migrations
      # P2a — live schema vs db/migrations/*.sql (skips cleanly without creds)
      - name: Verify no schema drift
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m scripts.verify_migrations
      # offline suite only — anything marked `integration` needs Supabase creds
      - run: SKIP_ENV_CHECK=1 pytest -m "not integration" -q

  integration:
    # P2b — the PostgREST/DB paths the offline suite can't cover (KIL writers,
    # queue dedupe, RLS). Self-skips when the secrets aren't configured.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt -r requirements-connectors.txt -r requirements-ingest.txt
      - name: pytest -m integration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}
        run: SKIP_ENV_CHECK=1 pytest -m integration -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run test:run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # e2e -- every /api/** call + the Supabase Auth session are mocked
      # (e2e/mocks.ts), so this needs no real Supabase/Salesforce secrets.
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
