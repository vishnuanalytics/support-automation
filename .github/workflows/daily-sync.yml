name: Daily docs sync

# Runs the Phase 1 ingestion on GitHub's runners so it never touches a
# local machine. Incremental: after the first full load, each run only
# re-embeds pages whose content-hash changed (usually a handful), so a
# run is cheap and well inside the free tier.
#
# Requires these repo secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL            https://mjohgmivnxfwkqmlojqs.supabase.co
#   SUPABASE_SERVICE_KEY    service_role key (Project Settings -> API)
#   NEO4J_URI               neo4j+s://<id>.databases.neo4j.io
#   NEO4J_USERNAME          Aura instance username
#   NEO4J_PASSWORD          Aura instance password
#   NEO4J_DATABASE          Aura DB name (some instances != "neo4j")

on:
  schedule:
    - cron: "0 3 * * *"      # 03:00 UTC daily
  workflow_dispatch: {}       # manual "Run workflow" button

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt -r requirements-ingest.txt -r requirements-connectors.txt

      - name: Scrape docs.zapier.com -> Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m ingestion.scraper

      - name: Sync graph -> Neo4j
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}
        run: python -m ingestion.neo4j_sync

      # Phase 21 / P1a (FR-40) — refresh the Case-resolution memory that feeds
      # `draft`, and the Neo4j Case-lifecycle graph the KIL loop reads. Both
      # also run as `worker` sweeps (every 60 min); this is the belt-and-braces
      # scheduled path. The SF_* secrets are optional — without them the
      # `--from-salesforce` half is skipped and only resolved `runs` are synced.
      - name: Refresh case_memory (resolved runs + closed SF Cases)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_CONSUMER_KEY: ${{ secrets.SF_CONSUMER_KEY }}
          SF_PRIVATE_KEY: ${{ secrets.SF_PRIVATE_KEY }}
          SF_DOMAIN: ${{ secrets.SF_DOMAIN }}
        # main() is if/else on --from-salesforce, so run both paths
        run: |
          python -m ingestion.case_memory_sync --once
          python -m ingestion.case_memory_sync --from-salesforce --once

      - name: Sync the Case-lifecycle graph -> Neo4j (KIL-a)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_CONSUMER_KEY: ${{ secrets.SF_CONSUMER_KEY }}
          SF_PRIVATE_KEY: ${{ secrets.SF_PRIVATE_KEY }}
          SF_DOMAIN: ${{ secrets.SF_DOMAIN }}
        run: python -m ingestion.case_graph_sync

      # Phase 31 — the Zendesk equivalent: same Neo4j case-lifecycle graph
      # for every `case_connector=zendesk` tenant. No-op when nobody uses it.
      - name: Sync the Zendesk case-lifecycle graph -> Neo4j
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}
        run: python -m ingestion.zendesk_case_graph_sync --once

      # Phase 30 — pull PostHog person rollups into Neo4j (:Contact) nodes
      # + resolve identity, for every tenant with an active `posthog`
      # integration. No-op when nobody has connected PostHog.
      - name: Sync product-analytics rollups -> Neo4j (Phase 30)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}
        run: python -m ingestion.product_analytics_sync --once

      # Scheduled refresh: `ingestion.kb_recrawl` reads every active
      # `kb_source_connections` row (migration 091 — public_url / gsheets /
      # gdocs / linear / nolt) and enqueues one `kb_sync` per connection.
      # Just enqueues; the drain step right after runs them — there's no
      # always-on worker host, same reason email-automation.yml drains its
      # own queue in-workflow.
      - name: Refresh KB sources (re-sync every active connection)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m ingestion.kb_recrawl

      # KB write-back to Google Docs (docs/KB_SOURCE_CONNECTORS.md §2): poll
      # the GitHub verification issues each automated doc edit opened —
      # closed -> `verified`; a `/revert` comment -> undo the doc edit +
      # re-sync. Per-tenant GitHub tokens come from tenant_integrations; a
      # revert enqueues a kb_sync the drain step below picks up.
      - name: Close the loop on KB doc write-backs
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m ingestion.kb_writeback_watch

      - name: Drain the job queue (kb_sync + gdoc_writeback + embed_kb_entry ...)
        continue-on-error: true
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m api.worker --once

      # audit C3 — trim old finished jobs / settled runs
      - name: Purge old jobs + runs
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m scripts.purge_old

      # Phase 26 — re-rank the free OpenRouter models (they churn weekly) so
      # llm.py's fallback chains stay current.
      - name: Refresh the free-model roster
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m scripts.refresh_llm_roster
